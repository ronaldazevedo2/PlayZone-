<div class="cadastro-view-container">
  <!-- Top Nav Header -->
  <div class="form-header-bar">
    <div class="breadcrumb-container">
      <h1>Editar Dados</h1>
      <div class="breadcrumb-links">
        <span class="home-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
        <span class="bc-link" (click)="cancelar()">Dados</span>
        <span class="bc-separator">&gt;</span>
        <span class="bc-current">Editar dados</span>
      </div>
    </div>

    <div class="header-form-buttons">
      <button class="btn-secondary" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="salvar()" [disabled]="salvando">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          class="save-icon" *ngIf="!salvando">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span class="spinner-sm" *ngIf="salvando"></span>
        {{ salvando ? 'Salvando...' : 'Salvar alterações' }}
      </button>
    </div>
  </div>

  <!-- Success Banner -->
  <div class="success-banner" *ngIf="successMessage">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Error Banner -->
  <div class="error-banner" *ngIf="errorMessages.length > 0">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      class="error-alert-icon">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div>
      <div *ngFor="let err of errorMessages">{{ err }}</div>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="carregando">
    <span class="spinner"></span>
    <p>Carregando dados cadastrais...</p>
  </div>

  <!-- Form Content -->
  <div class="form-content-grid" *ngIf="!carregando">
    <div class="form-card">
      <div class="form-card-header">
        <h3>Informações Pessoais</h3>
        <p>Seus dados de identificação e contato.</p>
      </div>

      <div class="form-fields-row">
        <div class="form-field-group full-width">
          <label>Nome Completo <span class="required">*</span></label>
          <input type="text" placeholder="Digite seu nome completo" [(ngModel)]="dadosNome">
        </div>
      </div>

      <div class="form-fields-row">
        <div class="form-field-group">
          <label>E-mail <span class="required">*</span></label>
          <input type="email" placeholder="seu@email.com" [(ngModel)]="dadosEmail">
        </div>

        <div class="form-field-group">
          <label>Contato / Telefone <span class="required">*</span></label>
          <input type="text" placeholder="(00) 00000-0000" [(ngModel)]="dadosContato">
        </div>
      </div>
    </div>

    <div class="form-card">
      <div class="form-card-header">
        <h3>Endereço</h3>
        <p>Informações de localização para atendimento.</p>
      </div>

      <div class="form-fields-row">
        <div class="form-field-group">
          <label>CEP</label>
          <input type="text" placeholder="00000-000" [(ngModel)]="dadosCep">
        </div>

        <div class="form-field-group">
          <label>Endereço</label>
          <input type="text" placeholder="Rua, Avenida, etc." [(ngModel)]="dadosEndereco">
        </div>
      </div>

      <div class="form-fields-row">
        <div class="form-field-group">
          <label>Número</label>
          <input type="text" placeholder="123" [(ngModel)]="dadosNumero">
        </div>

        <div class="form-field-group">
          <label>Bairro</label>
          <input type="text" placeholder="Centro" [(ngModel)]="dadosBairro">
        </div>

        <div class="form-field-group">
          <label>Cidade</label>
          <input type="text" placeholder="São Paulo" [(ngModel)]="dadosCidade">
        </div>
      </div>
    </div>
  </div>
</div>
